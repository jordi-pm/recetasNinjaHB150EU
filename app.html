<title>Mis Recetas Ninja HB150EU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --ground:#eceff3; --surface:#ffffff; --surface-2:#f5f7f9;
  --panel:#15181d; --panel-2:#23272e; --panel-ink:#e9edf2;
  --ink:#141a20; --ink-2:#3b454f; --muted:#5d6874;
  --line:#dae0e7; --line-2:#c6cfd8;
  --hot:#c9591a; --hot-soft:#fbeade;
  --cold:#0e6b80; --cold-soft:#e0f0f4;
  --warn:#a8341f; --warn-soft:#fbe6e1;
  --ok:#2c6b4a;
  --shadow:0 1px 2px rgba(20,26,32,.06), 0 8px 24px -12px rgba(20,26,32,.22);
  --r:14px;
  --tab-h:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0d1013; --surface:#171b21; --surface-2:#1e232a;
    --panel:#05070a; --panel-2:#1b2027; --panel-ink:#e9edf2;
    --ink:#e7ecf1; --ink-2:#c0c9d3; --muted:#93a0ad;
    --line:#272e36; --line-2:#333c46;
    --hot:#f08a42; --hot-soft:#331d0f;
    --cold:#5dc0d4; --cold-soft:#0e2a31;
    --warn:#f08472; --warn-soft:#331713;
    --ok:#6fc296;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0d1013; --surface:#171b21; --surface-2:#1e232a;
  --panel:#05070a; --panel-2:#1b2027; --panel-ink:#e9edf2;
  --ink:#e7ecf1; --ink-2:#c0c9d3; --muted:#93a0ad;
  --line:#272e36; --line-2:#333c46;
  --hot:#f08a42; --hot-soft:#331d0f;
  --cold:#5dc0d4; --cold-soft:#0e2a31;
  --warn:#f08472; --warn-soft:#331713;
  --ok:#6fc296;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
}
h1,h2,h3,h4{font-family:Archivo,"IBM Plex Sans",sans-serif; margin:0; text-wrap:balance; letter-spacing:-.015em}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
a{color:var(--cold)}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cold); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

.wrap{max-width:560px; margin:0 auto; padding:0 16px}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}

/* ---------- header ---------- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--ground); border-bottom:1px solid var(--line)}
.top-in{max-width:560px; margin:0 auto; padding:10px 16px; display:flex; gap:10px; align-items:center}
.back{width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); display:grid; place-items:center; flex:none; font-size:18px}
.top-title{font-family:Archivo; font-weight:600; font-size:17px; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ---------- home ---------- */
.hero{background:var(--panel); color:var(--panel-ink); border-radius:var(--r);
  padding:18px 18px 16px; margin-top:14px; position:relative; overflow:hidden}
.hero .eyebrow{color:#8b99a8}
.hero h1{font-size:25px; line-height:1.12; margin:6px 0 8px; color:#fff}
.hero p{margin:0; color:#9dabb9; font-size:13.5px}
.hero-strip{display:flex; gap:6px; margin-top:14px; flex-wrap:wrap}
.hero-chip{font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:600;
  letter-spacing:.08em; padding:5px 8px; border-radius:6px;
  background:var(--panel-2); color:#c3cdd7; border:1px solid #2e343c}

.search{display:flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--line); border-radius:12px; padding:0 12px; margin-top:14px; box-shadow:var(--shadow)}
.search input{flex:1; border:0; background:none; padding:13px 0; font:inherit; color:inherit; min-width:0}
.search input:focus{outline:none}
.search svg{flex:none; opacity:.5}

.grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px}
.cat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 12px; text-align:left; display:flex; flex-direction:column; gap:3px; min-height:92px;
  transition:border-color .15s, transform .1s}
.cat:active{transform:scale(.985)}
.cat .em{font-size:23px; line-height:1}
.cat .nm{font-family:Archivo; font-weight:600; font-size:14px; line-height:1.2; margin-top:auto}
.cat .ct{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted)}

.section-h{display:flex; align-items:baseline; justify-content:space-between; margin:26px 0 10px}
.section-h h2{font-size:17px}
.link-btn{font-size:13px; color:var(--cold); font-weight:500}

/* ---------- recipe card ---------- */
.card{display:flex; gap:12px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:10px; width:100%; text-align:left; align-items:center;
  box-shadow:var(--shadow); transition:transform .1s}
.card:active{transform:scale(.99)}
.card + .card{margin-top:10px}
.thumb{width:74px; height:74px; border-radius:10px; flex:none; object-fit:cover; background:var(--surface-2)}
.thumb-ph{width:74px; height:74px; border-radius:10px; flex:none; display:grid; place-items:center;
  font-size:26px; background:var(--surface-2); border:1px solid var(--line)}
.card-body{min-width:0; flex:1}
.card h3{font-size:15px; line-height:1.22; margin-bottom:5px}
.meta{display:flex; flex-wrap:wrap; gap:4px 10px; font-family:"IBM Plex Mono",monospace;
  font-size:11px; color:var(--muted)}
.card-fav{flex:none; width:40px; height:40px; display:grid; place-items:center; font-size:19px; border-radius:10px}
.star-off{filter:grayscale(1); opacity:.32}

/* ---------- panel key ---------- */
.key{display:inline-flex; align-items:center; gap:7px; background:var(--panel); color:#fff;
  border-radius:8px; padding:7px 11px; font-family:"IBM Plex Mono",monospace; font-weight:600;
  font-size:12.5px; letter-spacing:.06em; border:1px solid #30363f; white-space:nowrap}
.key .led{width:7px; height:7px; border-radius:50%; flex:none; background:#5dc0d4; box-shadow:0 0 7px #5dc0d4}
.key.is-hot .led{background:#f08a42; box-shadow:0 0 7px #f08a42}
.key.sm{padding:4px 8px; font-size:11px; border-radius:6px}

/* ---------- filters ---------- */
.chips{display:flex; gap:7px; overflow-x:auto; padding:2px 16px 2px; margin:0 -16px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; border:1px solid var(--line-2); background:var(--surface); border-radius:999px;
  padding:7px 13px; font-size:13px; font-weight:500; white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--panel); color:#fff; border-color:var(--panel)}
.filter-row{margin-top:10px}
.filter-row .eyebrow{margin-bottom:6px; display:block; padding:0}

/* ---------- detail ---------- */
.hero-img{width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:var(--r); margin-top:14px; background:var(--surface-2)}
.hero-ph{width:100%; aspect-ratio:16/10; border-radius:var(--r); margin-top:14px; display:grid;
  place-items:center; font-size:52px; background:var(--surface-2); border:1px solid var(--line)}
.det-title{font-size:24px; line-height:1.14; margin-top:16px}
.det-orig{color:var(--muted); font-size:13px; font-style:italic; margin-top:4px}
.statbar{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-top:14px}
.stat{background:var(--surface); padding:10px 6px; text-align:center}
.stat b{display:block; font-family:Archivo; font-size:15px; font-weight:600}
.stat span{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted)}
.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px; margin-top:12px}
.box > h3{font-size:15px; margin-bottom:10px}
.actions{display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:14px}
.btn{background:var(--panel); color:#fff; border-radius:12px; padding:14px 18px;
  font-family:Archivo; font-weight:600; font-size:15px; text-align:center}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line-2)}
.btn.wide{grid-column:1/-1}
.btn[disabled]{opacity:.45; cursor:not-allowed}

.scaler{display:flex; gap:6px; align-items:center; margin-bottom:12px}
.sc{flex:1; border:1px solid var(--line-2); background:var(--surface-2); border-radius:9px;
  padding:9px 0; font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:14px; text-align:center}
.sc[aria-pressed="true"]{background:var(--panel); color:#fff; border-color:var(--panel)}
.sc.blocked{color:var(--warn); border-color:var(--warn)}
.sc.blocked[aria-pressed="true"]{background:var(--warn); color:#fff}

ul.ing{list-style:none; margin:0; padding:0}
ul.ing li{display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--line); align-items:baseline}
ul.ing li:first-child{border-top:0}
.qty{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:13px; flex:none;
  min-width:74px; font-variant-numeric:tabular-nums; color:var(--ink)}
.qty.free{color:var(--muted); font-weight:500}

ol.steps{list-style:none; margin:0; padding:0; counter-reset:s}
ol.steps li{counter-increment:s; display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
ol.steps li::before{content:counter(s); font-family:"IBM Plex Mono",monospace; font-weight:600;
  font-size:12px; width:24px; height:24px; flex:none; border-radius:50%; background:var(--surface-2);
  border:1px solid var(--line-2); display:grid; place-items:center; color:var(--muted)}
.step-body{min-width:0; flex:1}
.step-body .key{margin-top:8px}

.note{border-radius:10px; padding:11px 13px; font-size:13.5px; margin-top:12px; line-height:1.45}
.note.warn{background:var(--warn-soft); color:var(--warn); border:1px solid currentColor}
.note.tip{background:var(--cold-soft); color:var(--cold); border:1px solid currentColor}
.note.hot{background:var(--hot-soft); color:var(--hot); border:1px solid currentColor}
.note b{font-family:Archivo}

.gauge{display:flex; gap:14px; align-items:center; margin-top:12px}
.gauge figcaption{font-size:12.5px; color:var(--muted); line-height:1.4}

.src{font-size:12.5px; color:var(--muted); line-height:1.6; margin-top:12px;
  border-top:1px dashed var(--line-2); padding-top:12px}
.src b{color:var(--ink-2); font-family:Archivo; font-weight:600}

/* ---------- cook mode ---------- */
#cook{position:fixed; inset:0; z-index:100; background:var(--ground); display:flex;
  flex-direction:column; padding-top:env(safe-area-inset-top,0px)}
.cook-top{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line)}
.cook-top .pr{flex:1; height:5px; border-radius:99px; background:var(--line); overflow:hidden}
.cook-top .pr i{display:block; height:100%; background:var(--panel); transition:width .25s}
.cook-main{flex:1; overflow-y:auto; padding:22px 20px; display:flex; flex-direction:column;
  justify-content:center; text-align:left; max-width:560px; margin:0 auto; width:100%}
.cook-step-n{font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600;
  letter-spacing:.16em; color:var(--muted); text-transform:uppercase}
.cook-cap{font-size:14px; color:var(--muted); margin-top:14px}
.cook-txt{font-family:Archivo; font-weight:600; font-size:27px; line-height:1.22; margin-top:8px}
.cook-key{margin-top:22px}
.cook-key .eyebrow{display:block; margin-bottom:8px}
.cook-key .key{font-size:19px; padding:14px 20px; border-radius:12px; letter-spacing:.08em}
.cook-key .key .led{width:10px; height:10px}
.cook-sub{font-family:"IBM Plex Mono",monospace; font-size:14px; margin-top:10px; color:var(--ink-2)}
.cook-nav{display:grid; grid-template-columns:auto 1fr; gap:10px; padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line); max-width:560px; margin:0 auto; width:100%}

/* ---------- shopping ---------- */
.shop-item{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--line)}
.shop-item:first-child{border-top:0}
.tick{width:24px; height:24px; border-radius:7px; border:1.5px solid var(--line-2); flex:none;
  display:grid; place-items:center; font-size:14px; background:var(--surface); margin-top:1px}
.tick.on{background:var(--ok); border-color:var(--ok); color:#fff}
.shop-txt{flex:1; min-width:0; font-size:14px}
.shop-txt small{display:block; color:var(--muted); font-size:11.5px; font-family:"IBM Plex Mono",monospace}
.done .shop-txt{text-decoration:line-through; color:var(--muted)}
.del{color:var(--muted); font-size:17px; padding:0 4px; flex:none}

/* ---------- machine ---------- */
.prog-row{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--line)}
.prog-row:first-child{border-top:0}
.prog-row .key{flex:none; min-width:126px; justify-content:flex-start}
.prog-row p{margin:0; font-size:13.5px; color:var(--ink-2)}
.prog-row p em{display:block; font-family:"IBM Plex Mono",monospace; font-style:normal;
  font-size:11px; color:var(--muted); margin-top:3px}
dl.safe{margin:0}
dl.safe dt{font-family:Archivo; font-weight:600; font-size:13.5px; margin-top:12px}
dl.safe dt:first-child{margin-top:0}
dl.safe dd{margin:3px 0 0; font-size:13.5px; color:var(--ink-2)}

.empty{text-align:center; color:var(--muted); padding:48px 20px; font-size:14px}
.empty .big{font-size:36px; display:block; margin-bottom:10px}

/* ---------- tabs ---------- */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface);
  border-top:1px solid var(--line); display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1; height:var(--tab-h); display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; font-size:10px; color:var(--muted); font-weight:500}
.tabs button .ic{font-size:19px; line-height:1}
.tabs button[aria-current="true"]{color:var(--ink)}
.badge{position:absolute; transform:translate(15px,-13px); background:var(--hot); color:#fff;
  font-family:"IBM Plex Mono",monospace; font-size:9px; font-weight:600; border-radius:99px;
  padding:1px 5px; line-height:1.5}
.sync{font-size:11px; color:var(--muted); text-align:center; padding:10px 0 4px; font-family:"IBM Plex Mono",monospace}
</style>

<header class="top" id="top">
  <div class="top-in">
    <button class="back" id="back" hidden aria-label="Volver">←</button>
    <div class="top-title" id="topTitle">Mis Recetas Ninja HB150EU</div>
  </div>
</header>

<main id="view" class="wrap"></main>

<nav class="tabs" id="tabs" aria-label="Secciones">
  <button data-tab="inicio" aria-current="true"><span class="ic">🥣</span>Inicio</button>
  <button data-tab="buscar"><span class="ic">🔍</span>Buscar</button>
  <button data-tab="favoritos"><span class="ic">⭐</span>Favoritos</button>
  <button data-tab="compra"><span class="ic">🛒</span><span id="shopBadge" class="badge" hidden>0</span>Compra</button>
  <button data-tab="maquina"><span class="ic">⚙️</span>Mi HB150EU</button>
</nav>

<div id="cook" hidden></div>

<script src="recetas.js"></script>
<script>
(function(){
"use strict";

/* ============================ estado ============================ */
var S = { fav: [], compra: [], vista:'inicio', prev:'inicio', cat:null, q:'', filtros:{}, receta:null, escala:1, paso:0 };
var DB = null, dbDoc = null, remoteReady = false, writeTimer = null;
var LS = 'ninja-hb150eu-v1';

function loadLocal(){
  try{ var raw = localStorage.getItem(LS); if(raw){ var o = JSON.parse(raw);
    if(Array.isArray(o.fav)) S.fav = o.fav; if(Array.isArray(o.compra)) S.compra = o.compra; } }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LS, JSON.stringify({fav:S.fav, compra:S.compra})); }catch(e){}
}
function persist(){
  saveLocal();
  if(!dbDoc) return;
  clearTimeout(writeTimer);
  writeTimer = setTimeout(function(){
    dbDoc.set({fav:S.fav, compra:S.compra, ts:Date.now()}).catch(function(){});
  }, 500);
}
loadLocal();

/* sincronización opcional entre dispositivos */
if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('db').then(function(db){
    if(!db) return;
    DB = db; dbDoc = db.doc('estado/app');
    dbDoc.onSnapshot(function(snap){
      if(!snap.exists){ remoteReady = true; return; }
      var d = snap.data() || {};
      if(!remoteReady){
        remoteReady = true;
        if(Array.isArray(d.fav)) S.fav = d.fav;
        if(Array.isArray(d.compra)) S.compra = d.compra;
        saveLocal(); render();
      } else if(!snap.metadata.hasPendingWrites){
        if(Array.isArray(d.fav)) S.fav = d.fav;
        if(Array.isArray(d.compra)) S.compra = d.compra;
        saveLocal(); render();
      }
    }, function(){});
  }).catch(function(){});
}

/* ============================ utilidades ============================ */
var FRACS = {0.125:'⅛', 0.25:'¼', 0.333:'⅓', 0.5:'½', 0.666:'⅔', 0.75:'¾'};
function fmt(n){
  if(n === null || n === undefined) return '';
  var r = Math.round(n*1000)/1000;
  var ent = Math.floor(r), frac = Math.round((r-ent)*1000)/1000;
  var f = FRACS[frac];
  if(f) return (ent ? ent + f : f);
  if(Math.abs(r - Math.round(r)) < 0.001) return String(Math.round(r));
  return String(r).replace('.', ',');
}
function cantidad(ing, k){
  if(ing.c === null) return { txt:'al gusto', libre:true };
  return { txt: fmt(ing.c * k) + (ing.u ? ' ' + ing.u : ''), libre:false };
}
function lineaIng(ing, k){
  var q = cantidad(ing, k);
  return q.libre ? ing.n : q.txt + ' de ' + ing.n;
}
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function tiempoTotal(r){ return (r.prep||0) + (r.coccion||0); }
function tiempoTxt(r){
  var t = tiempoTotal(r), s = t + ' min';
  if(r.reposo) s += ' + ' + (r.reposo >= 60 ? (r.reposo/60) + ' h' : r.reposo + ' min') + ' de reposo';
  return s;
}
function maxEscala(r){ return Math.max(1, Math.floor(r.limiteMl / r.cargaMl)); }
function esCaliente(r){ return r.limiteMl === MAQUINA.capacidad.calienteMl; }
function progKeys(r){
  var out = [], seen = {};
  r.pasos.forEach(function(p){ if(p.b && !seen[p.b]){ seen[p.b] = 1; out.push(p.b); } });
  return out;
}
function esCalorBoton(b){
  for(var i=0;i<MAQUINA.programas.length;i++) if(MAQUINA.programas[i].b === b) return MAQUINA.programas[i].calor;
  if(b === 'COOK') return true;
  return false;
}
function el(html){ var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function byId(id){ for(var i=0;i<RECETAS.length;i++) if(RECETAS[i].id === id) return RECETAS[i]; return null; }
function catById(id){ for(var i=0;i<CATEGORIAS.length;i++) if(CATEGORIAS[i].id === id) return CATEGORIAS[i]; return null; }

/* ============================ búsqueda y filtros ============================ */
function principales(){
  var m = {};
  RECETAS.forEach(function(r){ m[r.principal] = (m[r.principal]||0) + 1; });
  return Object.keys(m).sort();
}
function pasaFiltros(r){
  var f = S.filtros;
  if(f.cat && r.cat !== f.cat) return false;
  if(f.tiempo && tiempoTotal(r) > f.tiempo) return false;
  if(f.principal && r.principal !== f.principal) return false;
  if(f.dieta && r.tags.indexOf(f.dieta) < 0) return false;
  if(f.temp && r.tags.indexOf(f.temp) < 0) return false;
  if(f.textura && r.tags.indexOf(f.textura) < 0) return false;
  return true;
}
function buscar(q){
  var n = norm(q).trim();
  if(!n) return RECETAS.filter(pasaFiltros);
  var ts = n.split(/\s+/);
  return RECETAS.filter(pasaFiltros).filter(function(r){
    var hay = norm([r.nombre, r.original, r.principal, r.programa, r.cat, r.tags.join(' '),
      r.ing.map(function(i){ return i.n; }).join(' ')].join(' '));
    return ts.every(function(t){ return hay.indexOf(t) >= 0; });
  });
}

function jugSVG(cargaMl, limiteMl){
  var MAXV = 1700, H = 92, W = 62, y = function(ml){ return H - 6 - (Math.min(ml,MAXV)/MAXV) * (H-14); };
  var over = cargaMl > limiteMl;
  var col = over ? 'var(--warn)' : (limiteMl === 1400 ? 'var(--hot)' : 'var(--cold)');
  return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
    'aria-label="Nivel de llenado de la jarra">' +
    '<rect x="8" y="4" width="42" height="' + (H-8) + '" rx="5" fill="var(--surface-2)" stroke="var(--line-2)"/>' +
    '<rect x="10" y="' + y(cargaMl) + '" width="38" height="' + (H - 6 - y(cargaMl)) + '" rx="3" fill="' + col + '" opacity=".78"/>' +
    '<line x1="6" y1="' + y(1400) + '" x2="52" y2="' + y(1400) + '" stroke="var(--hot)" stroke-width="1.5" stroke-dasharray="3 2"/>' +
    '<line x1="6" y1="' + y(1600) + '" x2="52" y2="' + y(1600) + '" stroke="var(--cold)" stroke-width="1.5" stroke-dasharray="3 2"/>' +
    '<text x="54" y="' + (y(1400)+3) + '" font-size="7" font-family="IBM Plex Mono, monospace" fill="var(--hot)">HOT</text>' +
    '<text x="54" y="' + (y(1600)+3) + '" font-size="7" font-family="IBM Plex Mono, monospace" fill="var(--cold)">COLD</text>' +
    '</svg>';
}

function pasosCocina(r, k){
  var out = [];
  r.pasos.forEach(function(p){
    if(p.add && p.add.length){
      p.add.forEach(function(i, idx){
        var ing = r.ing[i], q = cantidad(ing, k);
        out.push({
          cap: idx === 0 ? (p.t || 'Carga la jarra') : null,
          txt: q.libre ? (ing.n.charAt(0).toUpperCase() + ing.n.slice(1)) :
               'Añade ' + q.txt + ' de ' + ing.n
        });
      });
      if(p.b) out.push({ txt: p.t || '', b: p.b, sub: p.sub });
    } else {
      out.push({ txt: p.t || '', b: p.b, sub: p.sub });
    }
  });
  return out.filter(function(s){ return s.txt || s.b; });
}
var wakeLock = null;
function pedirWake(){
  try{ if(navigator.wakeLock && navigator.wakeLock.request)
    navigator.wakeLock.request('screen').then(function(w){ wakeLock = w; }).catch(function(){}); }catch(e){}
}
function soltarWake(){ try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }

function renderCook(){
  var r = S.receta, pasos = pasosCocina(r, S.escala), n = pasos.length;
  if(S.paso >= n) S.paso = n - 1;
  var p = pasos[S.paso];
  var h = '<div class="cook-top"><button class="back" id="cookX" aria-label="Salir">✕</button>' +
    '<div class="pr"><i style="width:' + Math.round(((S.paso+1)/n)*100) + '%"></i></div>' +
    '<span class="eyebrow">' + (S.escala > 1 ? S.escala + '×' : '1×') + '</span></div>';
  h += '<div class="cook-main"><span class="cook-step-n">Paso ' + (S.paso+1) + ' de ' + n + '</span>';
  if(p.cap) h += '<p class="cook-cap">' + esc(p.cap) + '</p>';
  if(p.txt) h += '<p class="cook-txt">' + esc(p.txt) + '</p>';
  if(p.b){
    h += '<div class="cook-key"><span class="eyebrow">Pulsa en la batidora</span>' + keyHTML(p.b);
    if(p.sub) h += ' ' + keyHTML(p.sub);
    h += '</div>';
    if(esCalorBoton(p.b)) h += '<p class="cook-sub">Se encenderá el piloto HEAT ON.</p>';
  }
  h += '</div>';
  h += '<div class="cook-nav"><button class="btn ghost" id="cookPrev"' + (S.paso === 0 ? ' disabled' : '') + '>←</button>' +
    '<button class="btn" id="cookNext">' + (S.paso === n-1 ? '¡Listo! Terminar' : 'Siguiente →') + '</button></div>';

  var c = document.getElementById('cook');
  c.innerHTML = h; c.hidden = false;
  document.body.style.overflow = 'hidden';
}
function cerrarCook(){
  var c = document.getElementById('cook');
  c.hidden = true; c.innerHTML = '';
  document.body.style.overflow = '';
  soltarWake();
}

/* ============================ render ============================ */
var TITLES = { inicio:'Mis Recetas Ninja HB150EU', buscar:'Buscar', favoritos:'Favoritos',
  compra:'Lista de la compra', maquina:'Mi HB150EU' };

function render(){
  var v = document.getElementById('view');
  var back = document.getElementById('back');
  var title = document.getElementById('topTitle');
  var h;
  if(S.vista === 'receta' && S.receta){ h = vReceta(); back.hidden = false; title.textContent = S.receta.nombre; }
  else {
    back.hidden = true; title.textContent = TITLES[S.vista] || TITLES.inicio;
    if(S.vista === 'buscar') h = vBuscar();
    else if(S.vista === 'favoritos') h = vFavoritos();
    else if(S.vista === 'compra') h = vCompra();
    else if(S.vista === 'maquina') h = vMaquina();
    else h = vInicio();
  }
  v.innerHTML = h;
  var tab = S.vista === 'receta' ? null : S.vista;
  [].forEach.call(document.querySelectorAll('#tabs button'), function(b){
    b.setAttribute('aria-current', String(b.dataset.tab === tab));
  });
  var pend = S.compra.filter(function(i){ return !i.hecho; }).length;
  var badge = document.getElementById('shopBadge');
  badge.hidden = !pend; badge.textContent = pend;
  window.scrollTo(0, 0);
}

/* ============================ eventos ============================ */
function abrir(id){
  var r = byId(id); if(!r) return;
  S.prev = (S.vista === 'receta') ? S.prev : S.vista;
  S.receta = r; S.escala = 1; S.paso = 0; S.vista = 'receta'; render();
}
function toggleFav(id){
  var i = S.fav.indexOf(id);
  if(i >= 0) S.fav.splice(i, 1); else S.fav.unshift(id);
  persist(); render();
}

document.addEventListener('click', function(e){
  var t = e.target;
  var f = t.closest('[data-fav]');
  if(f){ e.stopPropagation(); toggleFav(f.dataset.fav); return; }
  var o = t.closest('[data-open]');
  if(o){ abrir(o.dataset.open); return; }
  var c = t.closest('[data-cat]');
  if(c){ S.filtros = {cat:c.dataset.cat}; S.q = ''; S.vista = 'buscar'; render(); return; }
  var g = t.closest('[data-tab-go]');
  if(g){ S.vista = g.dataset.tabGo; render(); return; }
  var tb = t.closest('#tabs button');
  if(tb){ S.vista = tb.dataset.tab; if(S.vista !== 'buscar'){ /* keep */ } render(); return; }
  if(t.closest('#back')){ S.vista = S.prev || 'inicio'; render(); return; }

  var fl = t.closest('[data-f]');
  if(fl){
    var key = fl.dataset.f, val = fl.dataset.v;
    if(!val) delete S.filtros[key];
    else S.filtros[key] = (key === 'tiempo') ? Number(val) : val;
    render(); return;
  }
  if(t.closest('#clearF')){ S.filtros = {}; S.q = ''; render(); return; }

  var sc = t.closest('[data-sc]');
  if(sc){ S.escala = Number(sc.dataset.sc); render(); return; }

  if(t.closest('#favBtn')){ toggleFav(S.receta.id); return; }

  if(t.closest('#addShop')){
    var r = S.receta, k = S.escala, añadidos = 0;
    r.ing.forEach(function(ing){
      var txt = lineaIng(ing, k);
      var key = r.id + '|' + txt;
      if(S.compra.some(function(i){ return i.k === key; })) return;
      S.compra.push({ k:key, t:txt, r:r.nombre + (k > 1 ? ' (' + k + '×)' : ''), hecho:false });
      añadidos++;
    });
    persist();
    var btn = document.getElementById('addShop');
    btn.textContent = añadidos ? '✓ ' + añadidos + ' ingredientes añadidos' : '✓ Ya estaban en la lista';
    btn.disabled = true;
    var badge = document.getElementById('shopBadge');
    var pend = S.compra.filter(function(i){ return !i.hecho; }).length;
    badge.hidden = !pend; badge.textContent = pend;
    return;
  }

  var tk = t.closest('[data-tick]');
  if(tk){
    var it = S.compra.filter(function(i){ return i.k === tk.dataset.tick; })[0];
    if(it){ it.hecho = !it.hecho; persist(); render(); }
    return;
  }
  var dl = t.closest('[data-del]');
  if(dl){
    S.compra = S.compra.filter(function(i){ return i.k !== dl.dataset.del; });
    persist(); render(); return;
  }
  if(t.closest('#clearShop')){
    if(confirm('¿Vaciar toda la lista de la compra?')){ S.compra = []; persist(); render(); }
    return;
  }

  if(t.closest('#cookBtn')){ S.paso = 0; renderCook(); pedirWake(); return; }
  if(t.closest('#cookX')){ cerrarCook(); return; }
  if(t.closest('#cookPrev')){ if(S.paso > 0){ S.paso--; renderCook(); } return; }
  if(t.closest('#cookNext')){
    var total = pasosCocina(S.receta, S.escala).length;
    if(S.paso >= total - 1){ cerrarCook(); }
    else { S.paso++; renderCook(); }
    return;
  }
});

document.addEventListener('keydown', function(e){
  if(document.getElementById('cook').hidden) return;
  if(e.key === 'ArrowRight'){ var n = pasosCocina(S.receta, S.escala).length;
    if(S.paso < n-1){ S.paso++; renderCook(); } }
  if(e.key === 'ArrowLeft'){ if(S.paso > 0){ S.paso--; renderCook(); } }
  if(e.key === 'Escape') cerrarCook();
});

document.addEventListener('input', function(e){
  if(e.target.id === 'qHome'){
    S.q = e.target.value; S.filtros = {}; S.vista = 'buscar'; render();
    var i = document.getElementById('qMain');
    if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  } else if(e.target.id === 'qMain'){
    S.q = e.target.value;
    var pos = e.target.selectionStart;
    render();
    var j = document.getElementById('qMain');
    if(j){ j.focus(); try{ j.setSelectionRange(pos, pos); }catch(err){} }
  }
});

document.addEventListener('keydown', function(e){
  var card = e.target.closest && e.target.closest('[data-open]');
  if(card && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); abrir(card.dataset.open); }
});

render();
})();
</script>
